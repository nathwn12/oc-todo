# Publish unattended via npm OIDC trusted publishing: no NPM_TOKEN, provenance is automatic.
# One-time binding on npmjs.com (run once as the package owner):
#   npm trust github oc-todo --file release.yml --repo nathwn12/oc-todo --allow-publish
# npm's ~5-15 min publish-time malware scan still applies, so the version is installable
# minutes after a green run.
name: release

on:
  push:
    tags: [v*]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi
      - run: npm publish --access public
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
